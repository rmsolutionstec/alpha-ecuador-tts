[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "studio-tts-latino"
version = "0.2.0"
description = "Aplicacion gratuita de texto a voz con perfiles de locucion en espanol latino"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "René Mejillón" }]
maintainers = [{ name = "Alpha Ecuador" }]
keywords = ["tts", "text-to-speech", "espanol", "latino", "locucion", "accessibility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Spanish",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "edge-tts>=7.2.3,<8",
    "pyttsx3>=2.99,<3",
]

[project.optional-dependencies]
build = ["pyinstaller>=6,<7"]

[project.urls]
Website = "https://alphaecuador.com"
Documentation = "https://alphaecuador.com"
Company = "https://alphaecuador.com"

[project.scripts]
studio-tts = "studio_tts_latino.cli:main"
studio-tts-gui = "studio_tts_latino.gui:main"

[tool.setuptools.packages.find]
include = ["studio_tts_latino*"]

[tool.setuptools.package-data]
studio_tts_latino = ["data/*.json"]
